<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#000000" />
  <title>Login — Bitcovex</title>
  <meta name="description" content="Log in to your Bitcovex account" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg: #000;
      --input-bg: #1a1f28;
      --input-border: rgba(255,255,255,0.14);
      --text: #eaecef;
      --muted: #848e9c;
      --accent: #F68F15;
      --error: #f6465d;
    }
    html, body { width: 100%; min-height: 100%; background: var(--bg); color: var(--text); font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
    .wrap { max-width: 460px; margin: 0 auto; padding: 0 20px 40px; }

    .topbar { display: flex; align-items: center; justify-content: space-between; padding: 18px 0; }
    .topbar-logo { display: flex; align-items: center; }
    .topbar-icons { display: flex; align-items: center; gap: 18px; color: #fff; }
    .topbar-icons a { color: #fff; display: flex; }

    .step-title-row { display: flex; align-items: center; justify-content: space-between; margin: 18px 0 26px; }
    h1 { font-size: 30px; font-weight: 800; letter-spacing: -0.5px; }
    .switch-link { color: var(--accent); font-size: 15px; font-weight: 600; text-decoration: none; }
    .back-row { display: flex; align-items: center; margin-bottom: 4px; }
    .back-btn { background: none; border: none; color: #fff; cursor: pointer; padding: 8px 0; display: flex; align-items: center; }

    .step { display: none; }
    .step.active { display: block; }

    .field { margin-bottom: 18px; }
    .field-label { display: block; font-size: 14px; color: var(--text); margin-bottom: 8px; }
    .field-input-wrap { position: relative; }
    .field-input {
      width: 100%; background: var(--input-bg); border: 1px solid var(--input-border);
      border-radius: 12px; color: var(--text); font-size: 16px; font-family: inherit;
      padding: 15px 42px 15px 16px; outline: none; transition: border-color .15s;
    }
    .field-input::placeholder { color: #5b6470; }
    .field-input:focus { border-color: rgba(255,255,255,0.5); }
    .field-input.invalid { border-color: var(--error); }
    .field-clear {
      position: absolute; right: 14px; top: 50%; transform: translateY(-50%);
      background: none; border: none; color: var(--muted); cursor: pointer;
      font-size: 18px; line-height: 1; display: none; padding: 4px;
    }
    .field-input:not(:placeholder-shown) ~ .field-clear { display: block; }
    .field-eye {
      position: absolute; right: 14px; top: 50%; transform: translateY(-50%);
      background: none; border: none; color: var(--muted); cursor: pointer; padding: 4px; display: flex;
    }
    .field-err { color: var(--error); font-size: 13px; margin-top: 8px; display: none; }
    .field-err.show { display: block; }

    .email-context { display: flex; align-items: center; justify-content: space-between; background: var(--input-bg); border: 1px solid var(--input-border); border-radius: 12px; padding: 14px 16px; margin-bottom: 18px; font-size: 15px; }
    .email-context button { background: none; border: none; color: var(--accent); font-size: 13px; font-weight: 600; cursor: pointer; font-family: inherit; }

    .forgot-link { display: block; text-align: right; color: var(--accent); font-size: 14px; text-decoration: none; margin: -6px 0 20px; }

    .btn-next {
      width: 100%; background: #2b2f38; color: #6b7280; border: none; border-radius: 999px;
      font-size: 17px; font-weight: 700; font-family: inherit; padding: 16px; cursor: not-allowed;
      transition: background .15s, color .15s; margin-bottom: 18px;
    }
    .btn-next.enabled { background: var(--accent); color: #000; cursor: pointer; }
    .btn-next.enabled:active { opacity: 0.85; }

    .divider { display: flex; align-items: center; gap: 14px; margin: 6px 0 22px; }
    .divider-line { flex: 1; height: 1px; background: rgba(255,255,255,0.12); }
    .divider-text { color: var(--muted); font-size: 14px; }

    .social-row { display: flex; justify-content: center; gap: 22px; margin-bottom: 26px; }
    .social-btn {
      width: 48px; height: 48px; border-radius: 50%; border: 1px solid rgba(255,255,255,0.18);
      background: none; display: flex; align-items: center; justify-content: center; cursor: pointer;
    }
  </style>
</head>
<body>

<div class="wrap">
  <div class="topbar">
    <a href="/" class="topbar-logo">
      <img src="/images/bitbase-logo.png" alt="Bitcovex" width="32" height="32" style="display:block;object-fit:contain;border-radius:8px;" />
    </a>
    <div class="topbar-icons">
      <a href="#" aria-label="Support">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M3 12a9 9 0 0 1 18 0v5a2 2 0 0 1-2 2h-1a1 1 0 0 1-1-1v-5a1 1 0 0 1 1-1h3M3 12v5a2 2 0 0 0 2 2h1a1 1 0 0 0 1-1v-5a1 1 0 0 0-1-1H3"/></svg>
      </a>
      <a href="#" aria-label="Language">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3a14 14 0 0 1 0 18M12 3a14 14 0 0 0 0 18"/></svg>
      </a>
    </div>
  </div>

  <!-- STEP 1: Email -->
  <div class="step active" id="stepEmail">
    <div class="step-title-row">
      <h1>Login</h1>
      <a class="switch-link" href="/signup">Sign Up</a>
    </div>

    <div class="field">
      <label class="field-label" for="contactInp">Email/Phone</label>
      <div class="field-input-wrap">
        <input class="field-input" id="contactInp" type="email" autocomplete="email" placeholder="Email/Phone Number" />
        <button class="field-clear" type="button" id="clearContact" aria-label="Clear">&times;</button>
      </div>
      <div class="field-err" id="contactErr">Please enter a valid email address.</div>
    </div>

    <button class="btn-next" type="button" id="toPasswordBtn">Next Step</button>

    <div class="divider"><div class="divider-line"></div><span class="divider-text">or</span><div class="divider-line"></div></div>
    <div class="social-row">
      <button class="social-btn" type="button" id="googleBtn" aria-label="Continue with Google">
        <svg width="22" height="22" viewBox="0 0 48 48"><path d="M43.611 20.083H42V20H24v8h11.303C33.654 32.657 29.332 36 24 36c-6.627 0-12-5.373-12-12s5.373-12 12-12c3.059 0 5.842 1.154 7.961 3.039L37.618 9.38C34.193 6.214 29.326 4 24 4 12.955 4 4 12.955 4 24s8.955 20 20 20 20-8.955 20-20c0-1.341-.138-2.65-.389-3.917z" fill="#FFC107"/><path d="M6.306 14.691l6.571 4.819C14.655 15.108 19.001 12 24 12c3.059 0 5.842 1.154 7.961 3.039L37.618 9.38C34.193 6.214 29.326 4 24 4 16.318 4 9.656 8.337 6.306 14.691z" fill="#FF3D00"/><path d="M24 44c5.166 0 9.86-1.977 13.409-5.192l-6.19-5.238C29.211 35.091 26.715 36 24 36c-5.314 0-9.826-3.417-11.402-8.092l-6.522 5.025C9.505 39.556 16.227 44 24 44z" fill="#4CAF50"/><path d="M43.611 20.083H42V20H24v8h11.303a12.04 12.04 0 01-4.087 5.571l6.19 5.238C36.971 39.205 44 34 44 24c0-1.341-.138-2.65-.389-3.917z" fill="#1976D2"/></svg>
      </button>
      <button class="social-btn" type="button" id="appleBtn" aria-label="Continue with Apple">
        <svg width="18" height="20" viewBox="0 0 814 1000" fill="#fff"><path d="M788.1 340.9c-5.8 4.5-108.2 62.2-108.2 190.5 0 148.4 130.3 200.9 134.2 202.2-.6 3.2-20.7 71.9-68.7 141.9-42.8 61.6-87.5 123.1-155.5 123.1s-85.5-39.5-164-39.5c-76 0-103.7 40.8-165.9 40.8s-105-57.8-155.5-127.4C46 790.7 0 663 0 541.8c0-207.5 133.4-317.5 264.4-317.5 73.5 0 134.5 48.4 179.8 48.4 43.2 0 111.3-51.3 192.6-51.3 30.5 0 108.2 2.6 168.5 80.1zm-234-181.5c31.1-36.9 53.1-88.1 53.1-139.3 0-7.1-.6-14.3-1.9-20.1-50.6 1.9-110.8 33.7-147.1 75.8-28.5 32.4-55.1 83.6-55.1 135.5 0 7.8 1.3 15.6 1.9 18.1 3.2.6 8.4 1.3 13.6 1.3 45.4 0 102.5-30.4 135.5-71.3z"/></svg>
      </button>
    </div>
  </div>

  <!-- STEP 2: Password -->
  <div class="step" id="stepPassword">
    <div class="back-row">
      <button class="back-btn" type="button" id="backToEmail" aria-label="Back">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5"/><path d="M12 19l-7-7 7-7"/></svg>
      </button>
    </div>
    <h1 style="margin-bottom:24px;">Enter password</h1>

    <div class="email-context">
      <span id="emailContextLbl"></span>
      <button type="button" id="editEmailBtn">Edit</button>
    </div>

    <div class="field">
      <label class="field-label" for="passwordInp">Password</label>
      <div class="field-input-wrap">
        <input class="field-input" id="passwordInp" type="password" autocomplete="current-password" placeholder="Enter your password" style="padding-right:44px" />
        <button class="field-eye" type="button" id="togglePw" aria-label="Show password">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
        </button>
      </div>
      <div class="field-err" id="passwordErr">Invalid email or password.</div>
    </div>

    <a class="forgot-link" href="/forgot-password">Forgot Password?</a>

    <button class="btn-next" type="button" id="loginBtn">Log In</button>
  </div>
</div>

<script>
(function () {
  const EMAIL_RE = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;

  const steps = {
    email: document.getElementById('stepEmail'),
    password: document.getElementById('stepPassword')
  };
  function goTo(name) {
    Object.values(steps).forEach(s => s.classList.remove('active'));
    steps[name].classList.add('active');
  }

  const contactInp = document.getElementById('contactInp');
  const contactErr = document.getElementById('contactErr');
  const clearContact = document.getElementById('clearContact');
  const toPasswordBtn = document.getElementById('toPasswordBtn');
  const emailContextLbl = document.getElementById('emailContextLbl');
  const editEmailBtn = document.getElementById('editEmailBtn');
  const backToEmail = document.getElementById('backToEmail');

  clearContact.addEventListener('click', () => { contactInp.value = ''; updateStep1Btn(); contactInp.focus(); });

  function updateStep1Btn() {
    toPasswordBtn.classList.toggle('enabled', EMAIL_RE.test(contactInp.value.trim()));
  }
  contactInp.addEventListener('input', updateStep1Btn);

  function goToPasswordStep() {
    const email = contactInp.value.trim();
    contactErr.classList.remove('show');
    contactInp.classList.remove('invalid');
    if (!EMAIL_RE.test(email)) {
      contactErr.classList.add('show'); contactInp.classList.add('invalid'); return;
    }
    emailContextLbl.textContent = email;
    passwordErr.classList.remove('show');
    passwordInp.classList.remove('invalid');
    passwordInp.value = '';
    goTo('password');
    setTimeout(() => passwordInp.focus(), 50);
  }
  toPasswordBtn.addEventListener('click', goToPasswordStep);
  contactInp.addEventListener('keydown', (e) => { if (e.key === 'Enter') goToPasswordStep(); });

  editEmailBtn.addEventListener('click', () => goTo('email'));
  backToEmail.addEventListener('click', () => goTo('email'));

  const passwordInp = document.getElementById('passwordInp');
  const passwordErr = document.getElementById('passwordErr');
  const togglePw = document.getElementById('togglePw');
  const loginBtn = document.getElementById('loginBtn');

  togglePw.addEventListener('click', () => {
    passwordInp.type = passwordInp.type === 'password' ? 'text' : 'password';
  });

  function updateLoginBtn() {
    loginBtn.classList.toggle('enabled', passwordInp.value.length >= 6);
  }
  passwordInp.addEventListener('input', updateLoginBtn);

  async function doLogin() {
    const email = contactInp.value.trim().toLowerCase();
    const password = passwordInp.value;
    passwordErr.classList.remove('show');
    passwordInp.classList.remove('invalid');
    if (password.length < 6) return;

    loginBtn.disabled = true;
    window.awShowLoading('Logging in…');
    try {
      const res = await fetch('/api/p2p/login', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        credentials: 'include',
        body: JSON.stringify({ email, password })
      });
      const data = await res.json().catch(() => ({}));
      if (res.ok) {
        const token = data.accessToken;
        if (token) localStorage.setItem('bitcovex_token', token);
        if (data.refreshToken) localStorage.setItem('bitcovex_refresh_token', data.refreshToken);
        if (data.user) localStorage.setItem('cvx_user', JSON.stringify(data.user));
        window.location.href = '/';
      } else {
        window.awHideLoading();
        loginBtn.disabled = false;
        passwordErr.textContent = data.message || 'Invalid email or password.';
        passwordErr.classList.add('show');
        passwordInp.classList.add('invalid');
      }
    } catch {
      window.awHideLoading();
      loginBtn.disabled = false;
      passwordErr.textContent = 'Network error. Please try again.';
      passwordErr.classList.add('show');
    }
  }
  loginBtn.addEventListener('click', doLogin);
  passwordInp.addEventListener('keydown', (e) => { if (e.key === 'Enter') doLogin(); });

  document.getElementById('googleBtn').addEventListener('click', () => alert('Google sign-in coming soon.'));
  document.getElementById('appleBtn').addEventListener('click', () => alert('Apple sign-in coming soon.'));
})();
</script>
<script src="/auth-widgets.js"></script>
</body>
</html>
