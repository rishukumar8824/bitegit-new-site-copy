<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>App config — Bitcovex admin</title>
<style>
  *{box-sizing:border-box}
  body{margin:0;background:#0d0d10;color:#e8e8ec;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Arial,sans-serif;padding:28px;max-width:760px;margin:0 auto}
  h1{font-size:20px;margin:0 0 4px}
  p.hint{color:#8a8a92;font-size:13px;margin:0 0 22px}
  h2{font-size:14px;margin:26px 0 10px;color:#00b7d4}
  label{display:block;font-size:12px;color:#9a9aa2;margin:12px 0 4px}
  input,textarea{width:100%;background:#17181c;border:1px solid #2a2b30;color:#fff;border-radius:8px;padding:9px 11px;font-size:13px;font-family:inherit}
  textarea{min-height:60px;resize:vertical}
  .row{display:flex;gap:12px}.row>div{flex:1}
  .promo{border:1px solid #2a2b30;border-radius:10px;padding:14px;margin:12px 0;position:relative}
  .rm{position:absolute;top:10px;right:10px;background:#3a1d22;color:#ff6b81;border:none;border-radius:6px;padding:4px 10px;font-size:11px;cursor:pointer}
  button.act{background:#00b7d4;color:#000;border:none;border-radius:8px;padding:11px 22px;font-size:13px;font-weight:700;cursor:pointer;margin-top:20px}
  button.add{background:#1f2937;color:#cbd5e1;border:1px dashed #3a4b5e;border-radius:8px;padding:10px 16px;font-size:12px;cursor:pointer}
  #msg{margin-top:14px;font-size:13px;padding:10px 12px;border-radius:8px;display:none}
  .ok{background:#0f2e1c;color:#4ade80}.err{background:#3a1d22;color:#ff6b81}
</style>
</head>
<body>
  <h1>App config</h1>
  <p class="hint">Controls the Android app's in-app update prompt and the promo popups. Saved live — the app picks it up on next launch.</p>

  <h2>Android version</h2>
  <div class="row">
    <div><label>Latest version code (integer, bump every release)</label><input id="lvc" type="number" min="1"></div>
    <div><label>Latest version name (e.g. 1.1.0)</label><input id="lvn"></div>
  </div>
  <label>APK URL</label><input id="apk">
  <label>Minimum supported version code — builds below this get a BLOCKING "update required"</label><input id="msv" type="number" min="1">
  <label>Release notes (shown in the update prompt)</label><textarea id="notes"></textarea>

  <h2>Promo popups</h2>
  <div id="promos"></div>
  <button class="add" onclick="addPromo()">+ Add promo</button>

  <br><button class="act" onclick="save()">Save</button>
  <div id="msg"></div>

<script>
const $=id=>document.getElementById(id);
function promoRow(p={}){
  const d=document.createElement('div');d.className='promo';
  d.innerHTML=`<button class="rm" onclick="this.parentNode.remove()">remove</button>
    <label>ID (stable, e.g. diwali_2026)</label><input class="p-id" value="${(p.id||'').replace(/"/g,'&quot;')}">
    <label>Image URL (optional, 16:10)</label><input class="p-img" value="${(p.imageUrl||'').replace(/"/g,'&quot;')}">
    <label>Title</label><input class="p-title" value="${(p.title||'').replace(/"/g,'&quot;')}">
    <label>Body</label><textarea class="p-body">${p.body||''}</textarea>
    <div class="row"><div><label>Button text</label><input class="p-cta" value="${(p.ctaText||'Learn more').replace(/"/g,'&quot;')}"></div>
    <div><label>Button URL</label><input class="p-url" value="${(p.ctaUrl||'').replace(/"/g,'&quot;')}"></div>
    <div><label>Min hours between showings</label><input class="p-int" type="number" min="0" value="${p.minIntervalHours??24}"></div></div>
    <label><input class="p-active" type="checkbox" ${p.active!==false?'checked':''}> Active</label>`;
  return d;
}
function addPromo(p){ $('promos').appendChild(promoRow(p)); }

async function load(){
  try{
    const r=await fetch('/api/admin/app/config',{credentials:'include'});
    if(!r.ok) throw new Error('Not authorized — log into the admin dashboard first.');
    const d=await r.json();
    $('lvc').value=d.android.latestVersionCode; $('lvn').value=d.android.latestVersionName;
    $('apk').value=d.android.apkUrl; $('msv').value=d.android.minSupportedVersionCode;
    $('notes').value=d.android.releaseNotes||'';
    (d.promos||[]).forEach(addPromo);
  }catch(e){ showMsg(e.message,'err'); }
}
function showMsg(t,c){ const m=$('msg'); m.textContent=t; m.className=c; m.style.display='block'; }

async function save(){
  const promos=[...document.querySelectorAll('.promo')].map(el=>({
    id:el.querySelector('.p-id').value, imageUrl:el.querySelector('.p-img').value,
    title:el.querySelector('.p-title').value, body:el.querySelector('.p-body').value,
    ctaText:el.querySelector('.p-cta').value, ctaUrl:el.querySelector('.p-url').value,
    minIntervalHours:Number(el.querySelector('.p-int').value)||24, active:el.querySelector('.p-active').checked
  }));
  const payload={android:{
    latestVersionCode:Number($('lvc').value), latestVersionName:$('lvn').value,
    apkUrl:$('apk').value, minSupportedVersionCode:Number($('msv').value), releaseNotes:$('notes').value
  }, promos};
  try{
    const r=await fetch('/api/admin/app/config',{method:'PUT',credentials:'include',
      headers:{'Content-Type':'application/json'},body:JSON.stringify(payload)});
    const d=await r.json();
    if(!r.ok) throw new Error(d.message||'Save failed');
    showMsg('Saved ✓','ok');
  }catch(e){ showMsg(e.message,'err'); }
}
load();
</script>
</body>
</html>
